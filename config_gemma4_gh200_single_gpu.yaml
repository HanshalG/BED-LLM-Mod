# Example config for trying Gemma 4 31B + 4B on one 95 GB GH200 GPU.
#
# The 31B model uses about 59 GiB for weights in the observed log. Keeping its
# gpu_memory_utilization below the default leaves room for the 4B engine.
# If startup still fails, lower the answerer value first, then the questioner
# value. The 31B model needed more KV cache than 0.70 could provide at 4096
# tokens in one observed GH200 run, so this example uses a shorter context.
version: 0

animals:
  - ['Coyote', 'Rhinoceros beetle', 'Wolverine', 'Saiga antelope', 'Yak', 'Kiwi', 'Zebra', 'Golden jackal', 'Horseshoe crab', 'Sand cat']

model_pairs:
  - questioner:
      model: "google/gemma-4-E4B-it"
      thinking: true
      cuda_visible_devices: "0"
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.20
      max_model_len: 3584
    answerer:
      model: "google/gemma-4-31B-it"
      thinking: true
      cuda_visible_devices: "0"
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.72
      max_model_len: 3584

method_names:
  - "EIG"

batched_block_size: 25
generation_temperature_diverse: 1.3
generation_temperature_simple: 1.0
answer_temperature: 0.7
search_depth: 1
forward_search_verbose: false
target_num_questions: 15
num_mc_samples: 15
max_num_samples: 50
min_num_samples: 15
threshold_rejection_probability: 0.2
belief_state_mode: "uniform"
belief_probability_temperature: 0.0
belief_distribution_num_calls: 1
belief_distribution_permute_history: false
probability_parse_fallback_to_uniform: true
belief_prior_mode: "none"
belief_prior_exponential_rate: 0.0
belief_generation_enabled: true
belief_filtering_enabled: true
answerer_sample_from_prior: false
answerer_randomize_prior_order_per_trial: false
answerer_num_prior_trials:
answerer_prior_seed:
