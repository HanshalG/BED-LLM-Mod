version: 0
# The one authorized model-scale L1 probe: only the strategy generator changes.
task: animals
model_pairs:
  - questioner:
      model: "google/gemma-4-31b-it"
      backend: openrouter
      thinking: true
      thinking_max_new_tokens: 1024
      thinking_final_max_new_tokens: 256
      max_model_len: 32768
    # The L1 runner never consults an answerer; retain the baseline spec for a valid pair.
    answerer:
      model: "google/gemma-4-26b-a4b-it"
      backend: openrouter
      thinking: false
      max_model_len: 32768
method_names:
  - "StrategyEIG"
batched_block_size: 256
generation_temperature_diverse: 0.0
generation_temperature_simple: 0.0
answer_temperature: 0.0
probability_parse_fallback_to_uniform: false
openrouter_budget_usd: 40.0
openrouter_run_budget_usd: 2.0
openrouter_projected_cost_usd: 1.5
openrouter_concurrency: 128
openrouter_max_retries: 5
openrouter_backoff_seconds: 1.0
openrouter_max_output_tokens: 4096
openrouter_spend_path: results/path_e/openrouter_spend.json
